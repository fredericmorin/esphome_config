esphome:
  name: led2
esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino
api:
  encryption:
    key: !secret led2__encryption_key
ota:
  - platform: esphome
    password: !secret led2__ota_password
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.88
logger:
web_server:
mdns:

light:
  - platform: cwww
    name: "Channel 1+2"
    restore_mode: RESTORE_DEFAULT_OFF
    cold_white: output1
    warm_white: output2
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    constant_brightness: true
    default_transition_length: 0.5s
    initial_state:
      state: on
      brightness: 0.1
  - platform: cwww
    name: "Channel 3+4"
    restore_mode: RESTORE_DEFAULT_OFF
    cold_white: output3
    warm_white: output4
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    constant_brightness: true
    default_transition_length: 0.5s
    initial_state:
      state: on
      brightness: 0.1
  # - platform: monochromatic
  #   name: "Channel 1"
  #   output: output1
  #   default_transition_length: 0.5s
  # - platform: monochromatic
  #   name: "Channel 2"
  #   output: output2
  #   default_transition_length: 0.5s
  # - platform: monochromatic
