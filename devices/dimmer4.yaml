esphome:
  name: dimmer4
  friendly_name: dimmer4
api:
  encryption:
    key: !secret dimmer4__encryption_key
ota:
  - platform: esphome
    password: !secret dimmer4__ota_password
esp8266:
  board: esp01_1m
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.54
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
web_server:
mdns:
captive_portal:

# Make sure logging is not using the serial port
logger:
  baud_rate: 0
uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600
# Register the Tuya MCU connection
tuya:
light:
  - platform: tuya
    name: Dimmer
    switch_datapoint: 1
    dimmer_datapoint: 2
    min_value: 10
    max_value: 1000
switch:
  - platform: restart
    name: "Restart"
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
