esphome:
  name: humi1
  friendly_name: humi1
api:
  encryption:
    key: !secret humi1__encryption_key
ota:
  platform: esphome
esp8266:
  board: esp8285
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.74
web_server:
mdns:
captive_portal:
logger:

substitutions:
  # How long the fan runs after someone presses the physical button.
  manual_run_time: "30min"

i2c:
  sda: GPIO13
  scl: GPIO04
  scan: false
  frequency: 100kHz

sensor:
  - platform: sht4x
    # calibrate: https://www.reddit.com/r/Esphome/comments/1horuxt/comment/m4f34q7/
    id: humi_sensor
    # update_interval: 5s  # default to 60s
    humidity:
      name: "Relative Humidity"
      accuracy_decimals: 1
    temperature:
      name: "Temperature"
      accuracy_decimals: 1

# Fired just before the manual timeout switches the fan off, so Home Assistant can tell a
# timeout apart from someone turning the fan off by hand.
event:
  - platform: template
    id: fan_timeout_event
    name: "Fan Timeout"
    event_types:
      - expired
    entity_category: diagnostic

script:
  - id: manual_fan_timeout
    mode: restart
    then:
      - delay: ${manual_run_time}
      - event.trigger:
          id: fan_timeout_event
          event_type: expired
      - switch.turn_off: relay

switch:
  - platform: gpio
    id: relay
    name: "Fan"
    icon: mdi:fan
    pin: GPIO05
    on_turn_on:
      - switch.turn_on: blue_led
      # - switch.turn_off: red_led
    on_turn_off:
      - switch.turn_off: blue_led
      - script.stop: manual_fan_timeout
      # - switch.turn_on: red_led
  - platform: gpio
    pin: GPIO12
    id: red_led
    internal: true
    inverted: true
  - platform: gpio
    pin: GPIO14
    id: blue_led
    internal: true
    inverted: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO03
      mode: INPUT_PULLUP
      inverted: true
    id: main_button
    internal: true
    on_press:
      - if:
          condition:
            switch.is_on: relay
          then:
            - switch.turn_off: relay
          else:
            - switch.turn_on: relay
            - script.execute: manual_fan_timeout

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: diagnostic