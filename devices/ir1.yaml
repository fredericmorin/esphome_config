esphome:
  name: ir1
  friendly_name: ir1
esp8266:
  board: esp8285
api:
  encryption:
    key: !secret ir1__encryption_key
ota:
  platform: esphome
  password: !secret ir1__ota_password
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.85
logger:
web_server:
mdns:

remote_receiver:
  id: rcvr
  pin:
    number: GPIO14
    inverted: true
  dump: all
remote_transmitter:
  id: tmtr
  pin: GPIO4
  carrier_duty_percent: 50%
climate:
  - platform: fujitsu_general
    name: AC
    receiver_id: rcvr
    transmitter_id: tmtr
    # sensor: current_temperature
    visual:
      min_temperature: 16
      max_temperature: 25
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1
