esphome:
  name: plug8
  friendly_name: plug8

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret plug8__encryption_key

ota:
  - platform: esphome
    password: !secret plug8__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Plug8 Fallback Hotspot"
    password: !secret plug8__ap_password

captive_portal:
    