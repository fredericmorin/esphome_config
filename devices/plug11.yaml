esphome:
  name: plug11
  friendly_name: plug11
esp8266:
  board: esp01_1m  # 1mb flash
  restore_from_flash: True
  early_pin_init: False
api:
  encryption:
    key: !secret plug11__encryption_key
ota:
  - platform: esphome
    password: !secret plug11__ota_password
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.121
logger:
  baud_rate: 0 # (UART logging interferes with cse7766)
  logs:
    sensor: DEBUG # (Overide any global setting, to VERBOSE will spamming the cse7766 sensors)
web_server:
mdns:

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    name: "Button"
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: cse7766
    current:
      name: "Current"
      accuracy_decimals: 2
      filters:
        - throttle_average: 10s
    voltage:
      name: "Voltage"
      accuracy_decimals: 2
      filters:
        - throttle_average: 10s
    power:
      name: "Power"
      accuracy_decimals: 2
      id: my_power
      filters:
        - throttle_average: 10s
    energy:
      name: "Energy"
      accuracy_decimals: 2
      filters:
        - throttle: 10s
    # apparent_power: #(only available with version 2024.3.0 or greater)
    #   name: "Apparent Power"
    #   filters:
    #     - throttle_average: 10s
    # power_factor: #(only available with version 2024.3.0 or greater)
    #   name: "Power Factor"
    #   accuracy_decimals: 2
    #   filters:
    #     - throttle_average: 10s

  - platform: total_daily_energy #(Optional, not specific to cse7766)
    name: "Daily Energy"
    power_id: my_power
    accuracy_decimals: 2

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO12
    id: relay
    restore_mode: ALWAYS_ON
  - platform: restart
    name: "Restart"

time:
  - platform: homeassistant
    id: homeassistant_time

status_led:
  pin:
    number: GPIO13
    inverted: True