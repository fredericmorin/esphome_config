output:
  - platform: ledc
    id: output1
    pin: GPIO13
    frequency: 100Hz
    # min_power: 0.0001
    # zero_means_zero: true
    # inverted: true
  - platform: ledc
    id: output2
    pin: GPIO14
    frequency: 100Hz
    # min_power: 0.0001
    # zero_means_zero: true
    # inverted: true

  - platform: ledc
    id: output3
    pin: GPIO27
    frequency: 100Hz
    # min_power: 0.0001
    # zero_means_zero: true
    # inverted: true
  - platform: ledc
    id: output4
    pin: GPIO26
    frequency: 100Hz
    # min_power: 0.0001
    # zero_means_zero: true
    # inverted: true
