esphome:
  name: aqi1
  friendly_name: aqi1
esp8266:
  #pinout https://hobbycomponents.com/development-boards/864-wemos-d1-mini-pro-esp8266-development-board
  board: esp01_1m
api:
  encryption:
    key: !secret aqi1__encryption_key
ota:
  platform: esphome
  password: !secret aqi1__ota_password
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.82
logger:
web_server:
mdns:

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  - id: uart_1  # soft
    rx_pin: GPIO2  # D4
    baud_rate: 9600
  - id: uart_2  # soft
    rx_pin: GPIO12  # D6 (moved off GPIO13, which is now the hardware SPI MOSI)
    tx_pin: GPIO15  # D8
    baud_rate: 9600

i2c:
  - id: i2c_1
    scl: GPIO5  # D1
    sda: GPIO4  # D2
    scan: false
    frequency: 100kHz

spi:
  - id: spi_1
    interface: hardware  # ESP8266 HSPI: CLK=GPIO14, MOSI=GPIO13 are fixed
    clk_pin: GPIO14  # D5
    mosi_pin: GPIO13  # D7

font:
  - file: "fonts/OpenSans-Regular.ttf"
    id: opensans10
    size: 10
  - file: "fonts/OpenSans-Regular.ttf"
    id: opensanslarge
    size: 32
  - file: "fonts/OpenSans-Regular.ttf"
    id: opensansverylarge
    size: 48

display:
  - platform: ssd1306_spi
    id: oled
    spi_id: spi_1
    data_rate: 8MHz  # SSD1306 max is 10MHz; 8MHz leaves margin for jumper-wire runs
    cs_pin: GPIO0  # D3
    dc_pin: GPIO16  # D0
    model: "SSD1306 128x64"
    brightness: 100%
    rotation: 0
    pages:
      - id: page1
        lambda: |-
          it.printf(105, 0-18, id(opensansverylarge), TextAlign::TOP_RIGHT, "%.0f", id(co2).state);
          it.print(it.get_width()+1, -2+5, id(opensans10), TextAlign::TOP_RIGHT, "CO2");
          it.print(it.get_width()+1, -2+5+10, id(opensans10), TextAlign::TOP_RIGHT, "ppm");

          it.printf(37, 30-2, id(opensanslarge), TextAlign::TOP_RIGHT, "%d", (int) id(temperature).state);
          it.print( 38, 30+12, id(opensans10), "deg");
          it.printf(38, 30+12+10, id(opensans10), ".%d C", (int) roundf(id(temperature).state * 10) % 10);

          it.printf(113, 30-2, id(opensanslarge), TextAlign::TOP_RIGHT, "%.0f", id(pm25).state);
          it.print(114, 30+12, id(opensans10), "PM");
          it.print(114, 30+12+10, id(opensans10), "2.5");

interval:
  - interval: 1s
    then:
      - component.update: oled

# reusable filter: average all raw readings over 60s, then publish once
.defaultfilters:
  - &throttle_avg
    throttle_average: 60s

sensor:
  # raw sensors are `internal` so they sample as fast as the hardware allows
  # (feeding the live display), while the `copy` sensors below publish a 60s
  # average to Home Assistant.
  - platform: pmsx003
    type: PMSX003
    uart_id: uart_1
    pm_1_0:
      id: pm1
      internal: true
    pm_2_5:
      id: pm25
      internal: true
    pm_10_0:
      id: pm10
      internal: true
  - platform: senseair
    uart_id: uart_2
    co2:
      id: co2
      internal: true
    update_interval: 5s
  - platform: sht4x
    # calibrate: https://www.reddit.com/r/Esphome/comments/1horuxt/comment/m4f34q7/
    id: sht4x_sensor
    update_interval: 5s  # sample fast; 60s average is published via the copy sensors below
    humidity:
      id: humidity
      internal: true
      accuracy_decimals: 1
    temperature:
      id: temperature
      internal: true
      accuracy_decimals: 1
  - { platform: copy, source_id: pm1,  name: "Particulate Matter <1.0µm Concentration",  filters: *throttle_avg }
  - { platform: copy, source_id: pm25, name: "Particulate Matter <2.5µm Concentration",  filters: *throttle_avg }
  - { platform: copy, source_id: pm10, name: "Particulate Matter <10.0µm Concentration", filters: *throttle_avg }
  - { platform: copy, source_id: co2,  name: "SenseAir CO2 Value", filters: *throttle_avg }
  - { platform: copy, source_id: humidity,    name: "Relative Humidity", filters: *throttle_avg }
  - { platform: copy, source_id: temperature, name: "Temperature",       filters: *throttle_avg }
