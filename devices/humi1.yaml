esphome:
  name: humi1
  friendly_name: humi1
api:
  encryption:
    key: !secret humi1__encryption_key
ota:
  platform: esphome
esp8266:
  board: esp8285
wifi:
  ssid: !secret niot_ssid
  password: !secret niot_password
  use_address: 10.32.5.74
web_server:
mdns:
captive_portal:
logger:

substitutions:
  on_humidity_threshold: "85"
  off_humidity_threshold: "75"

i2c:
  sda: GPIO13
  scl: GPIO04
  scan: false
  frequency: 100kHz

sensor:
  - platform: sht4x
    # calibrate: https://www.reddit.com/r/Esphome/comments/1horuxt/comment/m4f34q7/
    id: humi_sensor
    # update_interval: 5s  # default to 60s
    humidity:
      name: "Relative Humidity"
      accuracy_decimals: 1
    temperature:
      name: "Temperature"
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: |-
              if (x >= id(on_humidity_threshold_ui).state) {
                id(relay).turn_on();
              } else if (x >= id(off_humidity_threshold_ui).state) {
                id(relay).turn_off();
              }

number:
  - platform: template
    name: "On Humidity Threshold"
    id: on_humidity_threshold_ui
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: ${on_humidity_threshold}
    icon: "mdi:water-percent"
    entity_category: config
    on_value:
      - lambda: 'id(humi_sensor).update();'
  - platform: template
    name: "Off Humidity Threshold"
    id: off_humidity_threshold_ui
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: ${off_humidity_threshold}
    icon: "mdi:water-percent"
    entity_category: config
    on_value:
      - lambda: 'id(humi_sensor).update();'

switch:
  - platform: gpio
    id: relay
    name: "Fan"
    icon: mdi:fan
    pin: GPIO05
    on_turn_on:
      - switch.turn_on: blue_led
      # - switch.turn_off: red_led
    on_turn_off:
      - switch.turn_off: blue_led
      # - switch.turn_on: red_led
  - platform: gpio
    pin: GPIO12
    id: red_led
    internal: true
    inverted: true
  - platform: gpio
    pin: GPIO14
    id: blue_led
    internal: true
    inverted: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO03
      mode: INPUT_PULLUP
      inverted: true
    id: main_button
    internal: true
    on_press:
      - switch.toggle: relay

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: diagnostic